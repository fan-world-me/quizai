<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360, initial-scale=1.0">
  <title>Quiz AI Analyzer</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Guarantee popup width — Chrome clips popup to content width,
       so we force it here before CSS loads */
    html, body { min-width: 360px; width: 360px; }
  </style>
</head>
<body>
  <div class="shell">

    <!-- HEADER -->
    <div class="m3-header">
      <div class="m3-header-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="14" fill="url(#grad1)"/>
          <text x="14" y="19" text-anchor="middle" font-size="12" font-weight="900" fill="#fff" font-family="sans-serif">AI</text>
          <defs>
            <linearGradient id="grad1" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#7C4DFF"/>
              <stop offset="100%" stop-color="#448AFF"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="m3-header-text">
        <h1 class="m3-title">Quiz AI</h1>
        <p class="m3-subtitle">Аналіз тестів і скриншотів</p>
      </div>
      <div class="m3-chips">
        <span class="m3-chip" id="versionChip">v-</span>
        <span class="m3-chip m3-chip-accent" id="engineChip">auto</span>
      </div>
    </div>

    <!-- STATS GRID -->
    <div class="m3-grid">
      <div class="m3-stat-card">
        <span class="m3-stat-label">Ліміт</span>
        <span class="m3-stat-value" id="usageValue">—</span>
      </div>
      <div class="m3-stat-card">
        <span class="m3-stat-label">Стан</span>
        <span class="m3-stat-value m3-stat-sm" id="usageReset">очікує</span>
      </div>
    </div>

    <!-- INFO CARDS -->
    <div class="m3-info-card">
      <span class="m3-info-label">Поточний рушій</span>
      <span class="m3-info-value" id="engineDetailValue">Engine: auto</span>
    </div>

    <div class="m3-info-card">
      <span class="m3-info-label">Порядок fallback</span>
      <span class="m3-info-value" id="fallbackValue">Groq → NVIDIA → Gemini → OpenRouter</span>
    </div>

    <div class="m3-info-card">
      <span class="m3-info-label">Ключі</span>
      <span class="m3-info-value" id="keyCountValue">Groq: - | NVIDIA: - | Gemini: - | OpenRouter: -</span>
    </div>

    <!-- PROVIDERS -->
    <div class="m3-section-card">
      <div class="m3-section-head">
        <div>
          <span class="m3-info-label">Провайдери</span>
          <p class="m3-section-sub">Вибери один або кілька</p>
        </div>
        <button class="m3-text-btn" id="resetProvidersBtn" type="button">
          <span>Default</span>
        </button>
      </div>

      <label class="m3-provider-row">
        <div class="m3-checkbox-wrap">
          <input type="checkbox" value="groq" data-provider-toggle>
          <span class="m3-checkbox-ripple"></span>
        </div>
        <div class="m3-provider-info">
          <span class="m3-provider-name">Groq</span>
          <span class="m3-provider-desc">Швидкий основний рушій і vision</span>
        </div>
      </label>

      <label class="m3-provider-row">
        <div class="m3-checkbox-wrap">
          <input type="checkbox" value="nvidia" data-provider-toggle>
          <span class="m3-checkbox-ripple"></span>
        </div>
        <div class="m3-provider-info">
          <span class="m3-provider-name">NVIDIA</span>
          <span class="m3-provider-desc">Швидкі free endpoints</span>
        </div>
      </label>

      <label class="m3-provider-row">
        <div class="m3-checkbox-wrap">
          <input type="checkbox" value="gemini" data-provider-toggle>
          <span class="m3-checkbox-ripple"></span>
        </div>
        <div class="m3-provider-info">
          <span class="m3-provider-name">Gemini</span>
          <span class="m3-provider-desc">Краще для UA питань і скринів</span>
        </div>
      </label>

      <label class="m3-provider-row">
        <div class="m3-checkbox-wrap">
          <input type="checkbox" value="openrouter" data-provider-toggle>
          <span class="m3-checkbox-ripple"></span>
        </div>
        <div class="m3-provider-info">
          <span class="m3-provider-name">OpenRouter</span>
          <span class="m3-provider-desc">Безкоштовний фінальний fallback</span>
        </div>
      </label>
    </div>

    <!-- LAST TRACE -->
    <div class="m3-info-card">
      <span class="m3-info-label">Останній fallback</span>
      <span class="m3-info-value" id="attemptTraceValue">Немає даних</span>
    </div>

    <!-- TOGGLE -->
    <div class="m3-toggle-card">
      <div class="m3-toggle-text">
        <span class="m3-toggle-label">Автоаналіз</span>
        <span class="m3-toggle-sub" id="statusSublabel">Вимкнено</span>
      </div>
      <label class="m3-switch">
        <input type="checkbox" id="enabledToggle">
        <span class="m3-track">
          <span class="m3-thumb">
            <svg class="m3-thumb-icon m3-thumb-off" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg class="m3-thumb-icon m3-thumb-on" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <polyline points="3,8 7,12 13,4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </span>
      </label>
    </div>

    <!-- STATUS BAR -->
    <div class="m3-status" id="statusBar" role="alert" aria-live="polite"
         style="animation-delay:180ms">
      <span class="m3-status-dot"></span>
      <span id="statusText"></span>
    </div>

    <!-- BUTTONS -->
    <button class="m3-btn m3-btn-filled" id="analyzeBtn" style="animation-delay:200ms">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.8"/>
        <path d="M7 10l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Аналізувати сторінку
      <span class="m3-btn-ripple"></span>
    </button>

    <button class="m3-btn m3-btn-tonal" id="testConnectionBtn" type="button" style="animation-delay:220ms">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M4 10 C4 6.7 6.7 4 10 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M16 10 C16 13.3 13.3 16 10 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="10" cy="10" r="2" fill="currentColor"/>
      </svg>
      Перевірити з'єднання
      <span class="m3-btn-ripple"></span>
    </button>

    <div class="m3-btn-row" style="animation-delay:240ms">
      <button class="m3-btn m3-btn-error" id="clearBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M3 9h12M9 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" transform="rotate(45 9 9)"/>
        </svg>
        Скинути
        <span class="m3-btn-ripple"></span>
      </button>
      <button class="m3-btn m3-btn-outlined" id="howtoBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.6"/>
          <text x="9" y="13.5" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="sans-serif">?</text>
        </svg>
        Довідка
        <span class="m3-btn-ripple"></span>
      </button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
